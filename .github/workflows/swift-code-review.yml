# GitHub Action for Swift Code Review on Pull Requests
# Runs detailed static analysis and security checks

name: Swift Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'ios/**/*.swift'

jobs:
  analyze:
    name: Static Analysis
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get changed Swift files
        id: changed
        run: |
          CHANGED_FILES=$(git diff --name-only ${{ github.event.pull_request.base.sha }} HEAD -- 'ios/**/*.swift' | tr '\n' ' ')
          echo "changed_files=$CHANGED_FILES" >> $GITHUB_OUTPUT
        shell: bash

      - name: Analyze changed files
        run: |
          echo "=== Changed Swift Files ==="
          echo "${{ steps.changed.outputs.changed_files }}"
          
          if [ -z "${{ steps.changed.outputs.changed_files }}" ]; then
            echo "No Swift files changed"
            exit 0
          fi

      # SwiftLint with custom rules
      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Run SwiftLint on changed files
        run: |
          cd ios
          echo "=== SwiftLint Results ==="
          
          # Get list of changed files
          CHANGED=$(git diff --name-only ${{ github.event.pull_request.base.sha }} HEAD -- 'ios/**/*.swift')
          
          for file in $CHANGED; do
            if [ -f "$file" ]; then
              echo "Linting: $file"
              swiftlint --path "$file" --config ../.swiftlint.yml 2>&1 || true
            fi
          done

  security-scan:
    name: Security Scan
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Security Scan
        run: |
          echo "=== Security Analysis ==="
          
          # Check for common vulnerabilities in Swift
          echo ""
          echo "1. Checking for hardcoded credentials..."
          HARDCODE=$(grep -rn "password\s*=" ios/EnterpriseShell --include="*.swift" | grep -v "TODO\|FIXME\|// " || true)
          if [ -n "$HARDCODE" ]; then
            echo "⚠️ Potential hardcoded credentials found:"
            echo "$HARDCODE"
          else
            echo "✅ No hardcoded credentials"
          fi
          
          echo ""
          echo "2. Checking for SQL injection risks..."
          SQL=$(grep -rn "stringWithFormat\|NSString(format" ios/EnterpriseShell --include="*.swift" | grep -v "TODO\|FIXME" || true)
          if [ -n "$SQL" ]; then
            echo "⚠️ Potential SQL injection risk (string formatting):"
            echo "$SQL" | head -10
          else
            echo "✅ No obvious SQL injection risks"
          fi
          
          echo ""
          echo "3. Checking for weak crypto..."
          WEAK_CRYPTO=$(grep -rn "MD5\|SHA1\|RC4\|DES\b" ios/EnterpriseShell --include="*.swift" | grep -v "TODO\|FIXME" || true)
          if [ -n "$WEAK_CRYPTO" ]; then
            echo "⚠️ Weak cryptographic algorithms found:"
            echo "$WEAK_CRYPTO" | head -10
          else
            echo "✅ No weak crypto detected"
          fi
          
          echo ""
          echo "4. Checking for insecure URL handling..."
          HTTP_URL=$(grep -rn "http://" ios/EnterpriseShell --include="*.swift" | grep -v "TODO\|FIXME\|localhost" || true)
          if [ -n "$HTTP_URL" ]; then
            echo "⚠️ Insecure HTTP URLs found:"
            echo "$HTTP_URL"
          else
            echo "✅ All URLs use HTTPS"
          fi
          
          echo ""
          echo "5. Checking for sensitive data logging..."
          SENSITIVE_LOG=$(grep -rn "print.*\(token\|password\|secret\|key\)" ios/EnterpriseShell --include="*.swift" || true)
          if [ -n "$SENSITIVE_LOG" ]; then
            echo "⚠️ Potential sensitive data in logs:"
            echo "$SENSITIVE_LOG"
          else
            echo "✅ No sensitive data in logs"
          fi
          
          echo ""
          echo "6. Checking Keychain usage..."
          KEYCHAIN=$(grep -rn "kSecAttrAccessibleWhenUnlockedThisDeviceOnly" ios/EnterpriseShell --include="*.swift" | wc -l)
          echo "Keychain items with secure access: $KEYCHAIN"

  code-metrics:
    name: Code Metrics
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Calculate Metrics
        run: |
          echo "=== Code Metrics ==="
          
          # Total lines of Swift code
          TOTAL_LINES=$(find ios/EnterpriseShell -name "*.swift" -exec cat {} \; | wc -l)
          echo "Total Swift LOC: $TOTAL_LINES"
          
          # File count
          FILE_COUNT=$(find ios/EnterpriseShell -name "*.swift" | wc -l)
          echo "Swift Files: $FILE_COUNT"
          
          # Average file size
          AVG_LINES=$((TOTAL_LINES / FILE_COUNT))
          echo "Average lines per file: $AVG_LINES"
          
          echo ""
          echo "=== File Breakdown ==="
          echo "Services: $(find ios/EnterpriseShell/Services -name "*.swift" 2>/dev/null | wc -l)"
          echo "Views: $(find ios/EnterpriseShell/Views -name "*.swift" 2>/dev/null | wc -l)"
          echo "Models: $(find ios/EnterpriseShell/Models -name "*.swift" 2>/dev/null | wc -l)"
          echo "Utilities: $(find ios/EnterpriseShell/Utilities -name "*.swift" 2>/dev/null | wc -l)"
          
          echo ""
          echo "=== Issue Count ==="
          TODO_COUNT=$(grep -rn "TODO:" ios/EnterpriseShell --include="*.swift" | wc -l)
          FIXME_COUNT=$(grep -rn "FIXME:" ios/EnterpriseShell --include="*.swift" | wc -l)
          echo "TODOs: $TODO_COUNT"
          echo "FIXMEs: $FIXME_COUNT"
          
          echo ""
          echo "=== Complexity Indicators ==="
          NESTING=$(grep -rn "switch\|if\|guard\|for\|while" ios/EnterpriseShell/Services --include="*.swift" | wc -l)
          echo "Control flow statements: $NESTING"

  architecture-check:
    name: Architecture Review
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Architecture
        run: |
          echo "=== Architecture Review ==="
          
          echo ""
          echo "1. Checking delegate pattern usage..."
          DELEGATES=$(grep -rn "Delegate" ios/EnterpriseShell/Services --include="*.swift" | grep -v "protocol\|//" | wc -l)
          echo "Delegate references: $DELEGATES"
          
          echo ""
          echo "2. Checking for memory issues..."
          # Look for potential retain cycles
          RETAIN=$(grep -rn "\\[weak self\\]" ios/EnterpriseShell --include="*.swift" | wc -l)
          echo "Weak self references: $RETAIN"
          
          # Check for missing weak delegates
          STRONG_DELEGATE=$(grep -rn "var.*Delegate.*:" ios/EnterpriseShell/Services --include="*.swift" | grep -v "weak\|?" | head -5)
          if [ -n "$STRONG_DELEGATE" ]; then
            echo "Potential strong delegates (check for weak):"
            echo "$STRONG_DELEGATE"
          else
            echo "✅ No obvious strong delegate issues"
          fi
          
          echo ""
          echo "3. Checking error handling..."
          THROWS=$(grep -rn "throws" ios/EnterpriseShell/Services --include="*.swift" | wc -l)
          echo "Functions with throws: $THROWS"
          
          DO_CATCH=$(grep -rn "do {" ios/EnterpriseShell/Services --include="*.swift" | wc -l)
          echo "Do-catch blocks: $DO_CATCH"
          
          echo ""
          echo "4. Checking async/await usage..."
          ASYNC=$(grep -rn "async\|await" ios/EnterpriseShell/Services --include="*.swift" | wc -l)
          echo "Async/await references: $ASYNC"
          
          echo ""
          echo "5. Checking for completion handlers..."
          COMPLETION=$(grep -rn "@escaping" ios/EnterpriseShell/Services --include="*.swift" | wc -l)
          echo "Completion handlers: $COMPLETION"

  review-summary:
    name: Review Summary
    runs-on: macos-latest
    needs: [analyze, security-scan, code-metrics, architecture-check]
    if: always()
    steps:
      - name: Generate Summary
        run: |
          echo "## Code Review Summary"
          echo ""
          echo "### ✅ Completed Checks"
          echo "- Static Analysis"
          echo "- Security Scan"
          echo "- Code Metrics"
          echo "- Architecture Review"
          echo ""
          echo "### 📊 Project Health"
          echo "- Review the individual job results above for details"
          echo "- Address any warnings or errors before merging"
          echo ""
          echo "### 🔒 Security Focus"
          echo "- Ensure no credentials are hardcoded"
          echo "- Verify all URLs use HTTPS"
          echo "- Check for proper Keychain usage"
          echo ""
          echo "This PR is ready for review once all checks pass."
