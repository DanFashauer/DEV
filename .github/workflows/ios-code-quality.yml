name: iOS Code Quality

on:
  push:
    branches: [main, develop]
    paths:
      - 'ios/**/*.swift'
  pull_request:
    paths:
      - 'ios/**/*.swift'

env:
  DEVELOPER_DIR: /Applications/Xcode_15.0.app/Contents/Developer

jobs:
  swiftlint:
    name: SwiftLint
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.0.app/Contents/Developer

      - name: Cache SwiftLint
        uses: actions/cache@v3
        with:
          path: .swiftlint
          key: ${{ runner.os }}-swiftlint-${{ hashFiles('.swiftlint.yml') }}

      - name: Install SwiftLint
        run: |
          if [ ! -f ".swiftlint" ]; then
            brew install swiftlint
          fi

      - name: Run SwiftLint
        run: swiftlint --config .swiftlint.yml
        working-directory: ios

  security-analysis:
    name: Security Analysis
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.0.app/Contents/Developer

      - name: Build Project
        run: |
          cd ios
          xcodebuild -project EnterpriseShell.xcodeproj -scheme EnterpriseShell -configuration Debug build 2>&1 | head -100

      - name: Run Security Checks
        run: |
          echo "=== Running Security Checks ==="
          
          # Check for hardcoded credentials
          echo "Checking for hardcoded credentials..."
          grep -r "password\s*=" ios/EnterpriseShell --include="*.swift" || true
          grep -r "apiKey\s*=" ios/EnterpriseShell --include="*.swift" || true
          grep -r "clientSecret" ios/EnterpriseShell --include="*.swift" || true
          
          # Check for insecure URL schemes
          echo "Checking for insecure URL schemes..."
          grep -r "http://" ios/EnterpriseShell --include="*.swift" | grep -v "// TODO" | grep -v "// FIXME" || true
          
          # Check for TODO/FIXME that should be addressed
          echo "Checking for TODOs..."
          grep -rn "TODO:" ios/EnterpriseShell --include="*.swift" || true
          grep -rn "FIXME:" ios/EnterpriseShell --include="*.swift" || true

  code-review:
    name: Code Review Checks
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Custom Code Review
        run: |
          echo "=== iOS EnterpriseShell Code Review ==="
          
          # Check for common Swift issues
          echo ""
          echo "1. Checking for force unwraps..."
          grep -rn "!" ios/EnterpriseShell/Services --include="*.swift" | grep -v "// " | wc -l
          
          echo ""
          echo "2. Checking for print statements (should use AuditLogger)..."
          grep -rn "print(" ios/EnterpriseShell --include="*.swift" | grep -v "AuditLogger" || true
          
          echo ""
          echo "3. Checking for missing @objc attributes..."
          grep -rn "@objc" ios/EnterpriseShell --include="*.swift" | wc -l
          
          echo ""
          echo "4. File structure check..."
          echo "Services: $(ls -1 ios/EnterpriseShell/Services/*.swift | wc -l)"
          echo "Views: $(ls -1 ios/EnterpriseShell/Views/*.swift | wc -l)"
          echo "Models: $(ls -1 ios/EnterpriseShell/Models/*.swift | wc -l)"
          echo "Utilities: $(ls -1 ios/EnterpriseShell/Utilities/*.swift | wc -l)"
          
          echo ""
          echo "5. Checking delegate implementations..."
          grep -rn "Delegate" ios/EnterpriseShell/Services --include="*.swift" | head -20

  dependency-check:
    name: Dependency Check
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Swift Package Manager
        run: |
          echo "=== Checking Dependencies ==="
          
          # Check if project.yml exists for XcodeGen
          if [ -f "ios/project.yml" ]; then
            echo "XcodeGen configuration found"
            grep -A5 "packages:" ios/project.yml || echo "No SPM packages defined"
          fi
          
          # Check Info.plist for external schemes
          echo ""
          echo "External URL Schemes in Info.plist:"
          grep -A2 "CFBundleURLTypes" ios/EnterpriseShell/Info.plist || echo "No custom URL schemes"

  test:
    name: Unit Tests
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.0.app/Contents/Developer

      - name: Check for Tests
        run: |
          echo "=== Test Files ==="
          find ios -name "*Tests*.swift" -o -name "*Test.swift" 2>/dev/null | head -20 || echo "No test files found"
          echo ""
          echo "Note: Add test targets in project.yml for CI testing"

  build:
    name: Build
    runs-on: macos-latest
    needs: [swiftlint, security-analysis]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.0.app/Contents/Developer

      - name: Build
        run: |
          cd ios
          ls -la
          
          # Generate project if needed
          if [ -f "project.yml" ]; then
            which xcodegen || brew install xcodegen
            xcodegen generate
          fi
          
          # List available schemes
          xcodebuild -list || true
          
          # Build (will fail if project not properly configured)
          echo "Build step requires Xcode project configuration"
