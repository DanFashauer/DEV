name: Auto-Approve

on:
  workflow_dispatch:

# SECURITY: Least-privilege permissions
# - contents: read - needed to check files
# - pull-requests: read - needed to read PR info, write for approval
# - checks: read - needed to verify CI status
permissions:
  contents: read
  pull-requests: read
  checks: read

jobs:
  # === Policy Gate Check ===
  policy-gate:
    name: Policy Gate
    runs-on: ubuntu-latest
    outputs:
      should_approve: ${{ steps.check.outputs.should_approve }}
      reason: ${{ steps.check.outputs.reason }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Run Policy Gate
        id: check
        env:
          GITHUB_PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          # Run policy check
          cd .github/scripts
          bun run policy-gate.ts
          EXIT_CODE=$?
          
          if [ $EXIT_CODE -eq 0 ]; then
            echo "should_approve=true" >> $GITHUB_OUTPUT
            echo "reason=Policy gate passed" >> $GITHUB_OUTPUT
          elif [ $EXIT_CODE -eq 2 ]; then
            echo "should_approve=skip" >> $GITHUB_OUTPUT
            echo "reason=Skipped - no automerge label" >> $GITHUB_OUTPUT
          else
            echo "should_approve=false" >> $GITHUB_OUTPUT
            echo "reason=Policy gate failed" >> $GITHUB_OUTPUT
          fi

  # === Wait for Required Checks ===
  wait-for-checks:
    name: Wait for CI
    needs: policy-gate
    if: needs.policy-gate.outputs.should_approve == 'true'
    runs-on: ubuntu-latest
    outputs:
      all_passed: ${{ steps.verify.outputs.all_passed }}
    steps:
      - name: Wait for status checks
        id: verify
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # Wait up to 5 minutes for all status checks to complete
          TIMEOUT=300
          ELAPSED=0
          INTERVAL=10
          
          while [ $ELAPSED -lt $TIMEOUT ]; do
            # Get all required status checks
            STATUS=$(gh pr checks $PR_NUMBER --state pending 2>/dev/null | wc -l)
            
            if [ "$STATUS" -eq "0" ]; then
              # No pending checks - verify they all passed
              FAILED=$(gh pr checks $PR_NUMBER --state failure 2>/dev/null | wc -l)
              if [ "$FAILED" -eq "0" ]; then
                echo "all_passed=true" >> $GITHUB_OUTPUT
                exit 0
              fi
            fi
            
            echo "Waiting for checks... ($ELAPSED/$TIMEOUT)"
            sleep $INTERVAL
            ELAPSED=$((ELAPSED + INTERVAL))
          done
          
          echo "all_passed=false" >> $GITHUB_OUTPUT
          exit 1

  # === Submit Approval Review ===
  auto-approve:
    name: Auto-Approve PR
    needs: [policy-gate, wait-for-checks]
    if: |
      needs.policy-gate.outputs.should_approve == 'true' &&
      needs.wait-for-checks.outputs.all_passed == 'true'
    runs-on: ubuntu-latest
    # SECURITY: Grant write permission only for this job
    permissions:
      pull-requests: write
    steps:
      - name: Generate GitHub App Token
        id: generate-token
        uses: tibdex/github-app-token@v2
        with:
          app_id: ${{ vars.APP_ID }}
          private_key: ${{ secrets.APP_PRIVATE_KEY }}
          installation_id: ${{ vars.APP_INSTALLATION_ID }}

      - name: Submit Approval Review
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # Submit approval review with policy justification
          gh pr review $PR_NUMBER \
            --approve \
            --body "## 🤖 Auto-Approval

**Policy Gate**: ✅ PASSED

This PR meets all auto-approval criteria:
- ✅ Has \`automerge\` label
- ✅ Author is in allowlist
- ✅ No forbidden paths changed (.github/** always requires human approval)
- ✅ All CI checks passed
- ✅ Policy justification provided (if high-risk/security changes)

---
*This approval was automatically generated by the hardened policy gate system.*"

      - name: Enable Auto-Merge
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # Enable auto-merge after approval
          gh pr merge $PR_NUMBER --admin --auto

  # === Report Skip ===
  report-skip:
    name: Report Skip
    needs: policy-gate
    if: needs.policy-gate.outputs.should_approve == 'skip'
    runs-on: ubuntu-latest
    steps:
      - name: Comment on PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh pr comment $PR_NUMBER --body "## ℹ️ Auto-Approve Skipped

This PR does not meet auto-approve criteria:
- Missing \`automerge\` label

**To enable auto-approval:**
1. Add the \`automerge\` label to this PR
2. Ensure your PR changes are justified (see policy requirements)

**Note:** Changes to \`.github/**\` or policy-gate are NEVER auto-approved and require human review.

---
*This is an informational message from the policy gate system.*"
