name: iOS Build & Test

on:
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - '.swiftlint.yml'
  pull_request:
    branches: [main]
    paths:
      - 'ios/**'
      - '.swiftlint.yml'

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Verify Xcode version
        run: xcodebuild -version

      - name: Setup Swift
        run: swift --version

      - name: Generate Xcode project
        working-directory: ios
        run: |
          if [ -f "project.yml" ]; then
            xcodegen generate
          fi

      - name: Build EnterpriseShell
        working-directory: ios
        run: |
          xcodebuild -project EnterpriseShell.xcodeproj \
            -scheme EnterpriseShell \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 15' \
            build

  test:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Generate Xcode project
        working-directory: ios
        run: |
          if [ -f "project.yml" ]; then
            xcodegen generate
          fi

      - name: Run unit tests
        working-directory: ios
        run: |
          xcodebuild -project EnterpriseShell.xcodeproj \
            -scheme EnterpriseShell \
            -destination 'platform=iOS Simulator,name=iPhone 15' \
            test

  analyze:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Generate Xcode project
        working-directory: ios
        run: |
          if [ -f "project.yml" ]; then
            xcodegen generate
          fi

      - name: Run static analyzer
        working-directory: ios
        run: |
          xcodebuild -project EnterpriseShell.xcodeproj \
            -scheme EnterpriseShell \
            analyze

  swiftlint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run SwiftLint
        uses: norio-nomura/action-swiftlint@shifted
        with:
          args: '--config .swiftlint.yml'
