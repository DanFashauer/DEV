name: Auto-merge (no human approvals)

# Disabled during controlled-demo/manual-merge phase; manual runs only.
on:
  workflow_dispatch:


permissions:
  contents: write
  pull-requests: write

jobs:
  enable-auto-merge:
    runs-on: ubuntu-latest

    steps:
      - name: Gate: only auto-merge when label is present
        # Optional: require a label like "automerge" so nothing merges by surprise
        run: |
          echo '${{ toJson(github.event.pull_request.labels) }}' | grep -q '"name":"automerge"' || {
            echo "automerge label not found; skipping."
            exit 0
          }

      - name: Enable auto-merge (squash)
        uses: peter-evans/enable-pull-request-automerge@v3
        with:
          pull-request-number: ${{ github.event.pull_request.number }}
          merge-method: squash
